syntax = "proto3";

package qframework.protocols;

// 外层 Msg 的消息类型字段；当前只保留空类型和测试类型。
enum MsgType {
  None = 0; // 未指定业务类型。
  Test = 1; // 测试业务类型。
}

// 框架唯一公共业务消息；所有主题都发布该消息序列化后的字节。
message Msg {
  MsgType type = 1; // 当前消息类型。
  int64 time = 2; // 消息发送时间，单位为毫秒。
  string src = 3; // 消息来源模块名称。
  string dst = 4; // 消息目标模块名称；空字符串表示由业务层广播。
  bytes str = 5; // 业务模块约定的原始字节；不得经过 QString/UTF-8 文本转换。
}
