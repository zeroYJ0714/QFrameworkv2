; 模块加载顺序。默认值为空；仅列出的模块参与加载，适用于全部模块类型。
[Modules]
Names=InProcessUiExample, InProcessNonUiExample, ProcessUiExample, ProcessNonUiExample

[Module.InProcessUiExample]
; 是否加载该模块。默认值 true；false 时不加载 DLL。
Enabled=true
; 模块类型。可选 InProcessUi、InProcessNonUi、ProcessUi、ProcessNonUi。
Type=InProcessUi
; 界面显示名称。默认值为模块 ID；用于菜单、Dock 和状态提示。
DisplayName=主进程界面示例
; 模块文件路径。相对路径以本 INI 目录为基准；此处指向运行目录 Plugins。
FilePath=../Plugins/InProcessUiExample/InProcessUiExample.dll
; 是否在 onStart 前等待调试器。默认 false；仅 Debug 子进程有效，主进程模块忽略。
WaitForDebugger=false
; 等待调试器超时，单位毫秒，默认 30000；仅 Debug 子进程有效。
DebuggerWaitTimeoutMs=30000

[Module.InProcessNonUiExample]
; 是否加载该模块。默认值 true；false 时不加载 DLL。
Enabled=true
; 模块类型。可选 InProcessUi、InProcessNonUi、ProcessUi、ProcessNonUi。
Type=InProcessNonUi
; 界面显示名称。默认值为模块 ID；用于菜单和状态提示。
DisplayName=主进程非界面示例
; 模块文件路径。相对路径以本 INI 目录为基准。
FilePath=../Plugins/InProcessNonUiExample/InProcessNonUiExample.dll
; 是否在 onStart 前等待调试器。默认 false；主进程模块忽略。
WaitForDebugger=false
; 等待调试器超时，单位毫秒，默认 30000；主进程模块忽略。
DebuggerWaitTimeoutMs=30000

[Module.ProcessUiExample]
; 是否启动该子进程。默认值 true；false 时不启动且不自动重启。
Enabled=true
; 模块类型。此处固定为 ProcessUi。
Type=ProcessUi
; 界面显示名称。默认值为模块 ID；用于 Dock 和状态提示。
DisplayName=子进程界面示例
; 子进程 EXE 路径。相对路径以本 INI 目录为基准。
FilePath=../Plugins/ProcessUiExample/ProcessUiExample.exe
; 是否在 onStart 前等待 Visual Studio 附加。默认 false；仅 Debug 有效。
WaitForDebugger=false
; 等待调试器超时，单位毫秒，默认 30000；超时后继续启动。
DebuggerWaitTimeoutMs=30000

[Module.ProcessNonUiExample]
; 是否启动该子进程。默认值 true；false 时不启动且不自动重启。
Enabled=true
; 模块类型。此处固定为 ProcessNonUi。
Type=ProcessNonUi
; 界面显示名称。默认值为模块 ID；用于菜单和状态提示。
DisplayName=子进程非界面示例
; 子进程 EXE 路径。相对路径以本 INI 目录为基准。
FilePath=../Plugins/ProcessNonUiExample/ProcessNonUiExample.exe
; 是否在 onStart 前等待 Visual Studio 附加。默认 false；仅 Debug 有效。
WaitForDebugger=false
; 等待调试器超时，单位毫秒，默认 30000；超时后继续启动。
DebuggerWaitTimeoutMs=30000

[MessageBus]
; 每个订阅者的默认队列容量，单位条，默认 256；适用于未覆盖主题。
DefaultQueueCapacity=256
; 单条消息最大字节数，默认 16777216（16 MiB）；超过时拒绝发布。
MaxMessageBytes=16777216
; 切换到 QSharedMemory 的阈值，单位字节，默认 1048576（1 MiB）。
SharedMemoryThresholdBytes=1048576
; 停止时排空队列的最长时间，单位毫秒，默认 3000。
ShutdownDrainTimeoutMs=3000
; 默认队列策略，Reliable 表示满时拒绝，Latest 表示丢旧保新；默认 Reliable。
DefaultPolicy=Reliable

[Topic.QFRAMEWORK_IMAGE_RAW]
; 原始图像订阅者队列容量，单位条；默认继承 MessageBus/DefaultQueueCapacity。
QueueCapacity=4
; 原始图像单条最大字节数；默认继承 MessageBus/MaxMessageBytes。
MaxMessageBytes=16777216
; 流式图像策略，Latest 表示队列满时丢弃最旧帧并保留最新帧。
Policy=Latest

[Process]
; 子进程注册握手超时，单位毫秒，默认 10000。
RegistrationTimeoutMs=10000
; 心跳发送间隔，单位毫秒，默认 1000。
HeartbeatIntervalMs=1000
; 未收到心跳的故障判定时间，单位毫秒，默认 5000。
HeartbeatTimeoutMs=5000
; 正常停止等待时间，单位毫秒，默认 5000；超时后强制结束。
StopTimeoutMs=5000
; 故障后自动重启延迟，单位毫秒，默认 1000。
RestartDelayMs=1000
; 自动重启计数窗口，单位毫秒，默认 60000。
RestartWindowMs=60000
; 一个计数窗口内最多自动重启次数，默认 3；超限后等待手动重启。
MaxRestartCount=3

[Layout]
; 启动布局文件。相对路径以本 INI 目录为基准；默认空表示保持空白。
StartupFile=

[Style]
; 启动全局 QSS。相对路径以本 INI 目录为基准；默认空表示 Qt 默认样式。
File=Styles/Default.qss

[Logging]
; 日志目录。相对路径以本 INI 目录为基准；默认 ../Logs。
Directory=../Logs
; 单个日志文件最大字节数，默认 10485760（10 MiB）；按日期和大小滚动。
MaxFileBytes=10485760
; 滚动方式。固定 DateAndSize；旧日志不会自动删除。
Rolling=DateAndSize
